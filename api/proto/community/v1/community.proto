syntax = "proto3";

package community.v1;

option go_package = "github.com/sudo-odner/minor-shared/pkg/pb/community/v1;communityv1";

service DMService {
  rpc FetchPermission(FetchPermissionRequest) returns (FetchPermissionResponse);
  rpc FetchMembers(FetchMembersRequest) returns (FetchMembersResponse);
}

message FetchPermissionRequest {
  bytes user_id = 1;
  bytes channel_id = 2;
}

message FetchPermissionResponse {
  uint64 permission_mask = 1;
}

message FetchMembersRequest {
  bytes channel_id = 1;
}

message FetchMembersResponse {
  repeated bytes user_ids = 1;
}
