syntax = "proto3";

package relationship.v1;

option go_package = "github.com/sudo-odner/minor-shared/pkg/pb/relationship/v1;relationshipv1";

service RelationshipService {
  rpc FetchPermission(FetchPermissionRequest) returns (FetchPermissionResponse);
}

message FetchPermissionRequest {
  string user_id = 1;
  string channel_id = 2;
}

message FetchPermissionResponse {
  uint64 permission_mask = 1;
}
