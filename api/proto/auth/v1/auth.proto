syntax = "proto3";

package auth.v1;

option go_package = "github.com/sudo-odner/minor-shared/pkg/pb/auth/v1;authv1";

service AuthService {
    rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
}

message VerifyTokenRequest {
    string access_token = 1;
}

message VerifyTokenResponse {
    string user_id = 1;
    bool is_active = 2;
    int64 expires_at = 3;
    string error_message = 4;
}
